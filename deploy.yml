apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 1  # Number of instances of your app
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: 571600863856.dkr.ecr.ap-south-1.amazonaws.com/node-app:1.0.1  # Replace with your custom image if you built one
          ports:
            - containerPort: 3000  # Port your app listens on
          env:
            - name: NODE_ENV
              value: "dev"
---
apiVersion: v1
kind: Service
metadata:
  name: node-app-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: node-app
  ports:
    - protocol: TCP
      port: 80  # Port exposed by the service
      targetPort: 3000  # Port where the app is running inside the container
  type: LoadBalancer  # Expose externally (can also be NodePort or ClusterIP)



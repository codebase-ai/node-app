name: CI/CD via reusable workflow

on:
  push:
    branches: [ node ]
  pull_request:
    branches: [ code_review ]

permissions:  # 👈 Grant required permissions
  contents: read
  pull-requests: write

jobs:
  use-reusable-workflow:
    uses: codebase-ai/ci_cd_ai_generator/.github/workflows/main.yml@main
    with:
      run_docker_build: true
      push_docker: true
      request_code_review: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      

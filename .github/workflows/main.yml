
# CI workflow for pull requests to 'code_review' branch
name: "CI for Node.js Application (branch: code_review)"

on:
  pull_request:
    branches: [code_review]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


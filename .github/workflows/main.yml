name: Build and Push Docker Image

on:
  push:
    branches: [ "node" ]
  workflow_dispatch:  # allows manual trigger

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t shubhranshu19/my-node-app:latest .

      - name: Push Docker image
        run: docker push shubhranshu19/my-node-app:latest

      - name: Deploy container
        run: |
          docker run -d -p 3000:3000 shubhranshu19/my-node-app:latest > deploy.log 2>&1

      - name: Send logs to GenAI for review
        run: |
          curl -X POST "https://genai-api.mycompany.com/review" \
          -H "Content-Type: text/plain" \
          --data-binary @deploy.log

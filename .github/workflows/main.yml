
# CI workflow for pull requests to 'code_review' branch
name: "CI for Node.js Application (branch: code_review)"

on:
  pull_request:
    branches: [code_review]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

# CD workflow for pushes to 'node' branch
name: "CD for Node.js Application (branch: node)"

on:
  push:
    branches: [node]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t node-app:latest .

      - name: Push Docker image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
          docker tag node-app:latest "${DOCKER_USERNAME}/node-app:latest"
          docker push "${DOCKER_USERNAME}/node-app:latest"

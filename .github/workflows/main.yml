name: AI-Docker-CI-CD

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [node]

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        run: git diff origin/${{ github.base_ref }}...${{ github.head_ref }} > changes.diff

      - name: AI Code Review with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          REVIEW=$(curl -s -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {"role": "system", "content": "You are a code reviewer. Provide detailed feedback for improvements."},
                {"role": "user", "content": "'"$(cat changes.diff)"'"}
              ]
            }' | jq -r '.choices[0].message.content')
          echo "AI Review Output:"
          echo "$REVIEW"

  docker-build:
    runs-on: ubuntu-latest
    needs: ai-code-review
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t myapp:${{ github.sha }} .

      - name: AI Dockerfile Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          REVIEW=$(curl -s -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {"role": "system", "content": "Review the following Dockerfile for security and best practices."},
                {"role": "user", "content": "'"$(cat Dockerfile)"'"}
              ]
            }' | jq -r '.choices[0].message.content')
          echo "AI Dockerfile Feedback:"
          echo "$REVIEW"

      - name: Push Image to Docker Hub
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker tag myapp:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Docker Image
        run: trivy image ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }} > scan.txt

      - name: AI Analyze Scan Results
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl -s -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {"role": "system", "content": "Analyze this vulnerability scan and list the most critical issues with fixes."},
                {"role": "user", "content": "'"$(cat scan.txt)"'"}
              ]
            }' | jq -r '.choices[0].message.content')

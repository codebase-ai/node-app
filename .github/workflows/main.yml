name: CI/CD for Node.js Application (branch: node)
on:
    push:
        branches:
            - node
    pull_request:
        branches:
            - node


jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
            uses: actions/checkout@v3

        - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
                node-version: '16'

        - name: Install dependencies
            run: npm install

        - name: Run tests
            run: npm test

        - name: Build Docker image
            run: |
                docker build -t node-app:latest .

        - name: Push Docker image to Docker Hub
            env:
                DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            run: |
                echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
                docker tag node-app:latest "${DOCKER_USERNAME}/node-app:latest"
                docker push "${DOCKER_USERNAME}/node-app:latest"

                    code_review:
                        runs-on: ubuntu-latest

                        steps:
                        - name: Request code review
                            uses: actions/github-script@v6
                            with:
                                script: |
                                    const { context, github } = require('@actions/github');
                                    const pullRequest = context.payload.pull_request;
                                    if (pullRequest) {
                                        await github.rest.pulls.requestReviewers({
                                            owner: context.repo.owner,
                                            repo: context.repo.repo,
                                            pull_number: pullRequest.number,
                                            reviewers: ['reviewer1', 'reviewer2'] // Replace with GitHub usernames
                                        });
                                    } else {
                                        console.log('No pull request found.');
                                    }

                    deploy:
                        needs: [build, code_review]
                        runs-on: ubuntu-latest

                        steps:
                        - name: Checkout code
                            uses: actions/checkout@v3

                        - name: Set up Node.js
                            uses: actions/setup-node@v3
                            with:
                                node-version: '16'

                        - name: Install dependencies
                            run: npm install

                        - name: Start application
                            run: node app.js

                        - name: Deploy Docker image
                            env:
                                DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                                DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
                            run: |
                                echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
                                docker tag node-app:latest "${DOCKER_USERNAME}/node-app:latest"
                                docker push "${DOCKER_USERNAME}/node-app:latest"
